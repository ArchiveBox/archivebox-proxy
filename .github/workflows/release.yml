name: Wheels

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested wheels to PyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # New pushes replace obsolete builds, while an authorized upload can finish
  # all four wheels without a newer build cancelling it partway through.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'publish' || 'build' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}

jobs:
  wheels:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            architecture: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
          - target: macos-amd64
            runner: macos-15-intel
            architecture: x86_64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew list cmake >/dev/null || brew install cmake
      - name: Build and exercise Linux wheel
        if: runner.os == 'Linux'
        env:
          MANYLINUX_IMAGE: ${{ matrix.image }}
          WHEEL_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker run --rm -v "$PWD:/project" -w /project \
            -e WHEEL_ARCHITECTURE -e CARGO_TARGET_DIR=/tmp/target \
            "$MANYLINUX_IMAGE" bash -euo pipefail -c '
              dnf install -y clang clang-devel cmake git
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
              export PATH="/root/.cargo/bin:$PATH"
              uv run --no-project --python /opt/python/cp313-cp313/bin/python python bin/build_wheel.py --out-dir /tmp/native-wheel
              uvx --from auditwheel==6.8.2 auditwheel repair --plat "manylinux_2_28_$WHEEL_ARCHITECTURE" --wheel-dir dist /tmp/native-wheel/*.whl
              uv venv --python /opt/python/cp313-cp313/bin/python /tmp/wheel-test
              uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
              VIRTUAL_ENV=/tmp/wheel-test PATH="/tmp/wheel-test/bin:$PATH" uv run --no-project python bin/test_wheel.py --install-ca
            '
      - name: Build and exercise macOS wheel
        if: runner.os == 'macOS'
        env:
          WHEEL_ARCHITECTURE: ${{ matrix.architecture }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          uv run --no-project python bin/build_wheel.py --out-dir "$RUNNER_TEMP/native-wheel"
          uvx --from delocate==0.13.0 delocate-wheel --require-archs "$WHEEL_ARCHITECTURE" --wheel-dir dist "$RUNNER_TEMP/native-wheel"/*.whl
          uv venv --python 3.13 "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl
          VIRTUAL_ENV="$RUNNER_TEMP/wheel-test" PATH="$RUNNER_TEMP/wheel-test/bin:$PATH" uv run --no-project python bin/test_wheel.py --install-ca
      - name: Check package metadata
        run: |
          uvx --from twine==7.0.0 twine check --strict dist/*.whl
          uv publish --dry-run --trusted-publishing never dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
      - name: Require full CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh run list --workflow test.yml --commit "$GITHUB_SHA" --limit 20 --json conclusion --jq 'any(.[]; .conclusion == "success")')" = true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify all four distributions
        run: |
          uv run --no-project python - <<'PY'
          import tomllib
          import zipfile
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 4, wheels
          for platform in ('manylinux_2_28_x86_64', 'manylinux_2_28_aarch64', 'macosx_11_0_x86_64', 'macosx_11_0_arm64'):
              matching = [wheel for wheel in wheels if platform in wheel.name]
              assert len(matching) == 1, (platform, wheels)
          for wheel in wheels:
              assert wheel.name.startswith(f'archivebox_proxy-{version}-py3-none-'), wheel
              with zipfile.ZipFile(wheel) as archive:
                  engine = archive.getinfo('archivebox_proxy/engine/archivebox-proxy-engine')
                  assert engine.external_attr >> 16 & 0o111, wheel
                  metadata = archive.read(next(name for name in archive.namelist() if name.endswith('/WHEEL'))).decode()
                  assert 'Root-Is-Purelib: false' in metadata, wheel
          PY
      # Only wheels are published: installation never needs a compiler or a
      # first-run binary download, and unsupported platforms fail at resolution.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.whl
