name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
      - name: Install native build dependencies
        # These packages come from Ubuntu. Unrelated preinstalled repositories
        # (e.g. Microsoft's returning 403) must not block their index refresh.
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y clang cmake libclang-dev pkg-config
      - name: Build pinned Proxelar engine
        run: |
          uv run python bin/build_engine.py --fmt
          uv run python bin/build_engine.py --locked
          uv run python bin/build_engine.py --locked --clippy
      - name: Install and check controller
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -v

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: archivebox-proxy-ci
      ARCHIVEBOX_DATA: /tmp/archivebox-proxy-ci-data
      ARCHIVEBOX_PORT: "18800"
      PROXY_PORT: "18880"
      PROXY_WORKER_PORT: "18882"
      PLUGINS: screenshot,title,headers
      PROXY_PERSONA: Default
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate and start the complete deployment
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:18800/health/ | grep -qx OK
          docker compose exec -T proxy archivebox-proxy --export-ca > /tmp/proxy-ca.pem
      - name: Exercise HTTPS caching and automatic ArchiveBox capture
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed --noproxy '' --fail --silent --show-error --max-time 30 --cacert /tmp/proxy-ca.pem --proxy socks5h://127.0.0.1:18880 -H 'Accept-Encoding: gzip, deflate, br, zstd' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Dest: document' https://news.ycombinator.com/ask -o /tmp/first.html
          # Observe the asynchronous store before the one warm-cache request.
          for _ in {1..100}; do
            if docker compose exec -T proxy sh -c "grep -q 'STORED visitor .* 200 GET https://news.ycombinator.com/ask' /cache/proxy/proxy.log"; then
              break
            fi
            sleep 0.1
          done
          docker compose exec -T proxy sh -c "grep -q 'STORED visitor .* 200 GET https://news.ycombinator.com/ask' /cache/proxy/proxy.log"
          curl --compressed --noproxy '' --fail --silent --show-error --max-time 30 --cacert /tmp/proxy-ca.pem --proxy http://127.0.0.1:18882 -H 'Accept-Encoding: gzip, deflate, br, zstd' https://news.ycombinator.com/ask -D /tmp/second.headers -o /tmp/second.html
          cmp /tmp/first.html /tmp/second.html
          grep -qi '^x-archivebox-proxy-cache: HIT' /tmp/second.headers
          grep -q 'Hacker News' /tmp/second.html
          for _ in {1..180}; do
            if docker compose cp proxy:/cache/proxy/hooks.jsonl /tmp/hooks.jsonl 2>/dev/null; then
              if jq -e 'select(.event == "finish" and .returncode == 0)' /tmp/hooks.jsonl >/dev/null; then
                break
              fi
              if jq -e 'select(.event == "error" or (.event == "finish" and .returncode != 0))' /tmp/hooks.jsonl >/dev/null; then
                exit 1
              fi
            fi
            sleep 1
          done
          jq -e 'select(.event == "finish" and .returncode == 0)' /tmp/hooks.jsonl >/dev/null
          docker compose exec -T proxy uv run --no-project python - <<'PYCODE'
          import json
          from pathlib import Path
          screenshots = list(Path('/data/archive').rglob('screenshot/screenshot.png'))
          assert len(screenshots) == 1, screenshots
          assert screenshots[0].read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          assert screenshots[0].stat().st_size > 10000
          snapshot = screenshots[0].parent.parent
          assert 'Hacker News' in (snapshot / 'title/title.txt').read_text()
          response = json.loads((snapshot / 'headers/headers.json').read_text())
          assert response['status'] == 200
          assert response['response_headers']['x-archivebox-proxy-cache'] == 'HIT'
          assert len(Path('/cache/proxy/navigations.jsonl').read_text().splitlines()) == 1
          print('Automatic ArchiveBox capture saved screenshot, title, and cache HIT headers.')
          PYCODE
          curl --fail --silent --show-error http://localhost:18800/health/ | grep -qx OK
      - name: Show logs and stop the deployment
        if: always()
        run: |
          docker compose logs
          docker compose exec -T proxy cat /cache/proxy/hooks.log || true
          docker compose down --volumes
