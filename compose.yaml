services:
  proxy:
    build:
      context: .
      target: runtime
    image: archivebox-proxy:local
    restart: unless-stopped
    command:
      - --bind
      - 0.0.0.0
      - --port
      - "8080"
      - --worker-bind
      - 0.0.0.0
      - --worker-port
      - "8082"
      - --mode
      - ${PROXY_MODE:-forward}
      - --wireguard-endpoint
      - ${WIREGUARD_ENDPOINT:-127.0.0.1:8080}
      - --policy
      - ${PROXY_POLICY:-auto}
      - --cache-gb
      - ${PROXY_CACHE_GB:-50}
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080/tcp"
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080/udp"
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_WORKER_PORT:-8082}:8082/tcp"
    volumes:
      - proxy-cache:/cache
    stop_grace_period: 30s

volumes:
  proxy-cache:
