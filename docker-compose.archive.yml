# docker compose -f docker-compose.yml -f docker-compose.archive.yml up --build
# The archive is an optional read-only fallback, independent of proxy-cache.
services:
  proxy:
    environment:
      PROXY_ARCHIVE: /archivebox
    volumes:
      - type: bind
        source: ${ARCHIVEBOX_DATA:?Set ARCHIVEBOX_DATA to the existing ArchiveBox collection}
        target: /archivebox
        read_only: true
        bind:
          create_host_path: false
