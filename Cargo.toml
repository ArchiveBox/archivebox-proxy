[package]
name = "archivebox-proxy-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
proxyapi = { git = "https://github.com/emanuele-em/proxelar", rev = "91bf33d21c6ff6daa984979310e9b54795f70e4c", features = ["http3"] }
proxyapi_models = { git = "https://github.com/emanuele-em/proxelar", rev = "91bf33d21c6ff6daa984979310e9b54795f70e4c" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bytes = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
