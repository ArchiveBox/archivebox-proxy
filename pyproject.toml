[project]
name = "archivebox-proxy"
version = "0.1.0"
description = "Caching proxy with automatic ArchiveBox captures and archive replay"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/archivebox_proxy/engine/patches/Proxelar.LICENSE-MIT"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=43",
    "platformdirs>=4",
    "warcio>=1.7.5,<2",
]

[project.urls]
Homepage = "https://github.com/ArchiveBox/archivebox-proxy"
Repository = "https://github.com/ArchiveBox/archivebox-proxy"
Issues = "https://github.com/ArchiveBox/archivebox-proxy/issues"

[project.scripts]
archivebox-proxy = "archivebox_proxy.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["bin/**", "uv.lock"]
# Native sources belong in source distributions; installed wheels only need the
# prepared executable and its license. bin/build_wheel.py builds platform wheels.
wheel-exclude = ["*.rs", "Cargo.toml", "Cargo.lock", "*.patch"]

[dependency-groups]
dev = [
    "aioquic>=1.2,<2",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Anchor Ruff here so parent workspace settings cannot hide standalone CI errors.
[tool.ruff]
