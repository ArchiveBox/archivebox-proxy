[project]
name = "archivebox-proxy"
version = "0.1.0"
description = "Proxelar caching proxy with read-only ArchiveBox replay fallback"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "warcio>=1.7.5,<2"]

[project.scripts]
archivebox-proxy = "archivebox_proxy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aioquic>=1.2,<2",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
