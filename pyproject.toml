[project]
name = "archivebox-proxy"
version = "0.1.0"
description = "Caching proxy with automatic ArchiveBox captures and archive replay"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "patches/Proxelar.LICENSE-MIT"]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=43",
    "platformdirs>=4",
    "warcio>=1.7.5,<2",
]

[project.urls]
Homepage = "https://github.com/ArchiveBox/archivebox-proxy"
Repository = "https://github.com/ArchiveBox/archivebox-proxy"
Issues = "https://github.com/ArchiveBox/archivebox-proxy/issues"

[project.scripts]
archivebox-proxy = "archivebox_proxy.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archivebox_proxy"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/archivebox_proxy", "/bin/build_engine.py", "/bin/test_wheel.py", "/hatch_build.py",
    "/src", "/patches", "/Cargo.toml", "/Cargo.lock",
    "/rust-toolchain.toml", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE",
]

[dependency-groups]
dev = [
    "aioquic>=1.2,<2",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Anchor Ruff here so parent workspace settings cannot hide standalone CI errors.
[tool.ruff]

[tool.cibuildwheel]
# The executable has no Python ABI, so one build serves every supported Python.
build = "cp313-*"
skip = "*-musllinux_*"
build-frontend = "build[uv]"
test-command = "uv run --no-project python {project}/bin/test_wheel.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "dnf install -y clang clang-devel cmake git && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1 --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
